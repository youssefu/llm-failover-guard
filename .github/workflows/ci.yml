name: CI & Automated Codex PR Triage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Unit Test Suite
        run: python3 -m unittest discover -s tests -v
      - name: Run Self-Check Security Scan
        run: python3 llm_failover_guard.py scan . --fail-on-high
      - name: Verify Multi-Provider Failover Telemetry
        run: python3 llm_failover_guard.py simulate-failover --json
